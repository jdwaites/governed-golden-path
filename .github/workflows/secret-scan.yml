name: Secret Scan

# Compliance gate: scans for committed secrets (private keys, cloud
# credentials, tokens, etc.) with Gitleaks. Runs standalone on every push and
# PR — the broadest, earliest possible detection, independent of whether a
# build/deploy happens — and is also callable as a reusable workflow so
# build.yml can gate directly on it (see the secret-scan job there). Findings
# are uploaded to this repo's Security > Code scanning tab, not just left in
# a log someone has to go find.

on:
  push:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # weekly full-history sweep, catches anything a push-time scan might have missed
  workflow_dispatch:
  workflow_call:
    outputs:
      leaks_found:
        description: "true if Gitleaks found any leaks"
        value: ${{ jobs.gitleaks.outputs.leaks_found }}

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    outputs:
      leaks_found: ${{ steps.scan.outputs.leaks_found }}

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history, not just the tip — a push-time scan should cover every commit it introduces

    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
        tar xzf gitleaks.tar.gz gitleaks
        sudo mv gitleaks /usr/local/bin/
        gitleaks version

    - name: Run gitleaks
      id: scan
      run: |
        set +e
        gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif -v
        EXIT_CODE=$?
        set -e
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "leaks_found=false" >> "$GITHUB_OUTPUT"
        else
          echo "leaks_found=true" >> "$GITHUB_OUTPUT"
        fi
        exit $EXIT_CODE

    - name: Upload SARIF as workflow artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-results
        path: gitleaks-results.sarif
        retention-days: 90

    - name: Upload SARIF to code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gitleaks-results.sarif
      continue-on-error: true
