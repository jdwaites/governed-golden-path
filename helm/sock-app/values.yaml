# Default values for sock-app

# Traffic split configuration (percentages must add up to 100)
traffic:
  blue:
    weight: 50    # New version - start at 50%
    version: "1.3"
  green:
    weight: 50  # Current version - start at 50%
    version: "1.2"

# Image configuration
image:
  repository: 801507307735.dkr.ecr.us-east-1.amazonaws.com/octopus-eks-demo-app
  pullPolicy: Always

# Deployment configuration
replicaCount:
  blue: 1
  green: 1

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

# Istio gateway configuration
istio:
  gateway:
    enabled: true
    name: app-gateway
  virtualService:
    enabled: true
    name: app-routes

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
