name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      auto_approve:
        description: 'Auto-approve changes (for apply/destroy)'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'iac/**'
      - '.github/workflows/terraform.yml'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    defaults:
      run:
        working-directory: ./iac
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format Check
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan -out=tfplan -no-color
      continue-on-error: true

    - name: Upload Plan
      if: steps.plan.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: iac/tfplan
        retention-days: 5

    - name: Terraform Apply
      if: |
        inputs.action == 'apply' && 
        (inputs.auto_approve == true || github.event_name == 'push')
      run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: inputs.action == 'destroy' && inputs.auto_approve == true
      run: terraform destroy -auto-approve

    - name: Output Infrastructure Details
      if: inputs.action == 'apply' || github.event_name == 'push'
      run: terraform output -json > terraform-outputs.json

    - name: Upload Outputs
      if: inputs.action == 'apply' || github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs
        path: iac/terraform-outputs.json
        retention-days: 30

    - name: Comment PR with Plan
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('iac/tfplan.txt', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
          });
