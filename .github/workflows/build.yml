name: Build and Push Image (ECR)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.version'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Bump version (major, minor, patch)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: octopus-eks-demo-app

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get and increment version
      id: version
      run: |
        CURRENT_VERSION=$(cat .version)
        echo "Current version: $CURRENT_VERSION"
        
        # Increment patch version (e.g., 1.0 -> 1.1)
        IFS='.' read -r major minor <<< "$CURRENT_VERSION"
        NEW_MINOR=$((minor + 1))
        NEW_VERSION="${major}.${NEW_MINOR}"
        
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version will be: $NEW_VERSION"

  build:
    name: Build Single Artifact
    runs-on: ubuntu-latest
    needs: version
    
    permissions:
      contents: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        VERSION: ${{ needs.version.outputs.new_version }}
        BUILD_SHA: ${{ github.sha }}
      run: |
        echo "Building version $VERSION with SHA $BUILD_SHA"
        
        # Build single image with version info
        docker build \
          --build-arg APP_VERSION=$VERSION \
          --build-arg BUILD_SHA=$BUILD_SHA \
          -f app/Dockerfile \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_SHA \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          app/
        
        # Push all tags
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_SHA
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "Pushed image with tags: $VERSION, $BUILD_SHA, latest"

    - name: Update version file
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "${{ needs.version.outputs.new_version }}" > .version
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .version
        git commit -m "Bump version to ${{ needs.version.outputs.new_version }} [skip ci]" || echo "No changes"
        git push || echo "Nothing to push"

    - name: Create build summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## Build Complete ✅
        
        **Version:** \`${{ needs.version.outputs.new_version }}\`  
        **Build SHA:** \`${{ github.sha }}\`  
        **ECR Image:** \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.new_version }}\`
        
        ### Deployment Instructions
        
        **Deploy to Blue (New Version):**
        \`\`\`bash
        kubectl set image deployment/blue-app blue-app=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.new_version }} -n default
        \`\`\`
        
        **Or run deploy workflow:** [Deploy to EKS](../../actions/workflows/deploy.yml)
        EOF